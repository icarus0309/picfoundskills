name: Checks
on: [push, pull_request]
jobs:
  offline-validation:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r skills/image-case-retrieval/scripts/requirements.txt
      - run: python -X utf8 -m unittest discover -s skills/image-case-retrieval/tests -v
      - run: python -X utf8 tools/verify_report.py
      - name: Verify time and location comparison
        run: python -X utf8 tools/verify_hybrid_report.py
      - name: Verify lexical retrieval counts
        run: python -X utf8 tools/lexical_benchmark.py verify
      - name: Verify multimodal retrieval counts
        run: python -X utf8 tools/verify_semantic_report.py
